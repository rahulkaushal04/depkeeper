# ============================================================
# MkDocs Configuration for depkeeper
# ============================================================
# Documentation: https://rahulkaushal04.github.io/depkeeper/
# Repository: https://github.com/rahulkaushal04/depkeeper
# ============================================================

site_name: depkeeper
site_description: Modern, intelligent Python dependency management for requirements.txt files
site_author: Rahul Kaushal
site_url: https://rahulkaushal04.github.io/depkeeper/

repo_name: rahulkaushal04/depkeeper
repo_url: https://github.com/rahulkaushal04/depkeeper
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024-2026 Rahul Kaushal

# Strict mode: broken links and unresolved references fail the build rather
# than shipping a silently broken site (CI relies on this).
strict: true

# ============================================================
# Theme Configuration
# ============================================================

theme:
  name: material
  language: en

  # Automatic light/dark switching driven by the OS preference, with a
  # manual toggle as an override.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # JetBrains Mono is used for code so version specifiers such as `>=2.0,<3`
  # stay legible at small sizes.
  font:
    text: Inter
    code: JetBrains Mono

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

    # Table of contents
    - toc.follow # Sidebar scrolls with active heading

  icon:
    repo: fontawesome/brands/github
    logo: material/package-variant-closed
    edit: material/pencil
    view: material/eye

# ============================================================
# Plugins
# ============================================================

plugins:
  # The separator additionally splits on dots and brackets so a query for
  # `parse_file` or `depkeeper.core` matches API identifiers.
  - search:
      separator: '[\s\-\_\.\(\)\[\]\/]+'
      lang: en

  # API reference generated from the source docstrings. `docstring_style`
  # must match the project convention documented in
  # docs/contributing/code-style.md — Google style.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            docstring_style: google
            docstring_section_style: spacy
            # __init__ docstrings are folded into the class, so constructor
            # arguments are documented under `Args:` in the class docstring.
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            # Source order, not alphabetical: modules are written so public
            # API appears before private helpers.
            members_order: source
            filters:
              - "!^_"
              - "^__init__$"

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

# ============================================================
# Markdown Extensions
# ============================================================

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  # These `!!python/name:` tags are why mkdocs.yml is excluded from the
  # check-yaml pre-commit hook: a safe loader rejects them.
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Turns bare issue/PR references into links against this repository.
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: rahulkaushal04
      repo: depkeeper
  - pymdownx.mark
  - pymdownx.smartsymbols
  # `check_paths` fails the build on a missing snippet instead of rendering
  # an empty include; abbreviations are appended to every page.
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

# ============================================================
# Extra Configuration
# ============================================================

extra:
  # Enables the version selector; requires deploying with `mike`.
  version:
    provider: mike

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rahulkaushal04/depkeeper
      name: depkeeper on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/depkeeper/
      name: depkeeper on PyPI
    - icon: fontawesome/solid/bug
      link: https://github.com/rahulkaushal04/depkeeper/issues
      name: Report an issue

  # Labels available to pages via the `status:` front-matter key.
  status:
    new: Recently added
    deprecated: Deprecated

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

