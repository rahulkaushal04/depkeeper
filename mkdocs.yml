# ============================================================
# Validation
# ============================================================
# Paired with `strict: true` above: anything set to `warn` or `error` here
# fails the build, while `info` entries stay advisory.

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
