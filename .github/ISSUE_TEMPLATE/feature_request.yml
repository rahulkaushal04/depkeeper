name: Feature request
description: Suggest an improvement or new capability.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like depkeeper to do? Example commands or output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you tried.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - "`check` command"
        - "`update` command"
        - requirements.txt
        - pyproject.toml
        - environment.yml
        - Configuration
        - Documentation
        - Other
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute this?
      options:
        - "Yes, I can open a PR"
        - "Maybe, with some guidance"
        - "No"
