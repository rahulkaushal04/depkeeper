# Runs lint checks and the test suite (Python 3.8-3.12 on Linux, macOS, Windows).
# Triggers: pushes and pull requests targeting main or develop.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Check formatting
        run: ruff format --check depkeeper tests
      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F depkeeper tests

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: Python 3.8 and 3.9 have no build for Ubuntu 26.04, which
        # `ubuntu-latest` now points to. Move to ubuntu-latest once 3.8 is dropped.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project (dev mode)
        run: |
          pip install -e ".[dev]"

      - name: Run tests with coverage
        shell: bash
        run: |
          pytest tests \
            --cov=depkeeper \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      # Save coverage file as an artifact (useful even if Codecov fails)
      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      # Only upload once to Codecov to avoid duplicate data
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: depkeeper-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  test-summary:
    name: Test Summary
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Display matrix result
        shell: bash
        run: |
          echo "Overall test job result: ${{ needs.test.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          else
            echo "All test jobs passed successfully"
          fi
