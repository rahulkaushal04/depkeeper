name: Publish to PyPI

# Triggered by pushing a version tag, e.g.:
#   git tag -a v0.1.1 -m "Release 0.1.1"
#   git push origin v0.1.1
#
# Authenticates to PyPI via Trusted Publishing (OIDC) -- no stored API token.
# One-time setup required on PyPI: on the depkeeper project's "Publishing"
# settings page, add a trusted publisher with:
#   Owner:            rahulkaushal04
#   Repository name:  depkeeper
#   Workflow name:    publish.yml
#   Environment name: pypi
# See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare tag, __version__.py and pyproject.toml
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          INIT_VERSION=$(python -c "from depkeeper.__version__ import __version__; print(__version__)")
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          echo "Tag:        $TAG_VERSION"
          echo "__version__: $INIT_VERSION"
          echo "pyproject:   $PYPROJECT_VERSION"

          if [ "$TAG_VERSION" != "$INIT_VERSION" ] || [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION __version__.py=$INIT_VERSION pyproject.toml=$PYPROJECT_VERSION"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/depkeeper/
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
