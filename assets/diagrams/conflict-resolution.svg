<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 990" role="img">
<title>the resolver loops up to 100 passes: scan for conflicts, record them, resolve within major boundaries, then adopt an advisory alternative only where a conflict stays live</title>
<desc>The update set maps each package to its recommended or current version, and metadata is prefetched concurrently. Each pass scans requires_dist at the proposed versions for cross-conflicts, records new ones in a cumulative conflict_tracking, and resolves one conflict per source package: first an older source release within its major (up to 50 candidates), else constraining the target and reverting the source, else reverting both. The loop ends when no conflicts are found (converged), when a pass changes nothing (stalled) or after 100 passes (not converged). Afterwards an advisory alternative that satisfies every live conflict is adopted only where a live conflict remains, and each Package is annotated with its resolved version and live conflicts in a ResolutionResult.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="989" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">
<rect x="100" y="30" width="300" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="52" font-weight="700" fill="#0F172A" font-size="12.5">Build update set</text>
<text x="250.0" y="70" font-size="11" fill="#475569">name to recommended or current</text>
<path d="M250,80 V112" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="100" font-size="11" fill="#475569" text-anchor="start">proposals</text>
<rect x="100" y="112" width="300" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="130" font-weight="700" fill="#0F172A" font-size="12.5">Prefetch metadata</text>
<text x="250.0" y="148" font-size="11" fill="#475569">prefetch_packages, one concurrent burst</text>
<path d="M250,156 V216" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="180" font-size="11" fill="#475569" text-anchor="start">update set</text>
<rect x="14" y="184" width="412" height="516" rx="10" fill="none" stroke="#94A3B8" stroke-dasharray="3 4"/>
<text x="26" y="200" font-size="11" font-weight="600" fill="#475569" text-anchor="start">up to 100 passes</text>
<rect x="100" y="216" width="300" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="238" font-weight="700" fill="#0F172A" font-size="12.5">Scan for cross-conflicts</text>
<text x="250.0" y="256" font-size="11" fill="#475569">requires_dist at proposed versions</text>
<path d="M250,266 V300" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="288" font-size="11" fill="#475569" text-anchor="start">Conflict list</text>
<polygon points="250,300 370,336 250,372 130,336" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="250" y="334" font-weight="700">conflicts found?</text><text x="250" y="349" font-size="11" fill="#475569"></text>
<path d="M250,372 V404" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="392" font-size="11" fill="#475569" text-anchor="start">yes</text>
<rect x="100" y="404" width="300" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="426" font-weight="700" fill="#0F172A" font-size="12.5">Record conflicts</text>
<text x="250.0" y="444" font-size="11" fill="#475569">deduped, kept in conflict_tracking</text>
<path d="M250,454 V488" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="476" font-size="11" fill="#475569" text-anchor="start">conflicts by source</text>
<rect x="100" y="488" width="300" height="90" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="507" font-weight="700" fill="#0F172A" font-size="12.5">Resolve within major boundary</text>
<text x="250.0" y="525" font-size="11" fill="#475569">1  older source release (50 tried at most)</text>
<text x="250.0" y="540" font-size="11" fill="#475569">2  else cap target, revert source</text>
<text x="250.0" y="555" font-size="11" fill="#475569">3  else revert both to current</text>
<text x="250.0" y="570" font-size="11" fill="#475569">one conflict per source package</text>
<path d="M250,578 V610" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="598" font-size="11" fill="#475569" text-anchor="start">update set</text>
<polygon points="250,610 370,646 250,682 130,646" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="250" y="644" font-weight="700">version changed?</text><text x="250" y="659" font-size="11" fill="#475569"></text>
<path d="M130,646 H56 V241 H98" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="42" y="444" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 42 444)">yes: rescan</text>
<path d="M370,336 H540 V767 H402" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#as)"/>
<text x="436" y="328" font-size="11" fill="#475569" text-anchor="start">no: converged</text>
<path d="M370,646 H540" fill="none" stroke="#475569" stroke-width="1.5"/>
<text x="436" y="638" font-size="11" fill="#475569" text-anchor="start">no: stalled</text>
<text x="470" y="759" font-size="11" fill="#475569" text-anchor="middle">loop exit</text>
<path d="M250,700 V742" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#as)"/>
<text x="260" y="724" font-size="11" fill="#475569" text-anchor="start">100 passes: not converged</text>
<rect x="100" y="742" width="300" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="764" font-weight="700" fill="#0F172A" font-size="12.5">Advisory alternatives</text>
<text x="250.0" y="782" font-size="11" fill="#475569">highest version satisfying all live conflicts</text>
<path d="M250,792 V824" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="812" font-size="11" fill="#475569" text-anchor="start">alternatives</text>
<rect x="100" y="824" width="300" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="250.0" y="846" font-weight="700" fill="#0F172A" font-size="12.5">Adopt where conflict stays live</text>
<text x="250.0" y="864" font-size="11" fill="#475569">satisfies every live conflict, differs</text>
<path d="M250,874 V906" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="260" y="894" font-size="11" fill="#475569" text-anchor="start">final update set</text>
<rect x="100" y="906" width="300" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
<text x="250.0" y="925" font-weight="700" fill="#0F172A" font-size="12.5">Annotate + ResolutionResult</text>
<text x="250.0" y="943" font-size="11" fill="#475569">recommended_version = resolved</text>
<text x="250.0" y="958" font-size="11" fill="#475569">iterations_used, converged</text>
</g>
</svg>
