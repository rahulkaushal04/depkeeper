<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" role="img">
<title>Both commands share one pipeline from source adapters through PyPIDataStore, VersionChecker and DependencyAnalyzer to the report; only update exits sideways to verify and the atomic write</title>
<desc>check and update pass a path to the source registry, whose adapters (requirements.txt, pyproject.toml, environment.yml) return a List[Requirement]. PyPIDataStore fetches PyPI JSON through HTTPClient and feeds VersionChecker, which returns a List[Package] to DependencyAnalyzer. Its ResolutionResult goes to the report (table, json-v2, markdown). update additionally runs verify (pip --dry-run) and a two-phase atomic write through the adapters.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="647" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.6"><text x="20" y="56">CLI</text><text x="20" y="170">SOURCES</text><text x="20" y="290">DATA</text><text x="20" y="390">RECOMMEND</text><text x="20" y="490">CROSS-CHECK</text><text x="20" y="590">OUTPUT</text><text x="650" y="440">UPDATE ONLY</text></g>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F172A" text-anchor="middle">
<rect x="130" y="24" width="195" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="227" y="48" font-weight="600">check</text><text x="227" y="66" font-size="11" fill="#475569">read-only</text>
<rect x="335" y="24" width="195" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="432" y="48" font-weight="600">update</text><text x="432" y="66" font-size="11" fill="#475569">writes</text>
<rect x="130" y="118" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="146" y="139" text-anchor="start" font-size="12"><tspan font-weight="600">registry</tspan><tspan fill="#475569" font-size="11" dx="8">file name picks the adapter</tspan></text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><rect x="138" y="152" width="120" height="48" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/><text x="198" y="180">requirements.txt</text><rect x="270" y="152" width="120" height="48" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/><text x="330" y="180">pyproject.toml</text><rect x="402" y="152" width="120" height="48" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/><text x="462" y="180">environment.yml</text></g>
<rect x="130" y="258" width="190" height="56" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="225" y="282" font-weight="600">PyPIDataStore</text><text x="225" y="300" font-size="11" fill="#475569">one fetch per package</text>
<rect x="400" y="258" width="130" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="465" y="282" font-weight="600">HTTPClient</text><text x="465" y="300" font-size="11" fill="#475569">retries · backoff</text>
<rect x="130" y="358" width="400" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="330" y="382" font-weight="600">VersionChecker</text><text x="330" y="400" font-size="11" fill="#475569">major boundary · min_age · policy · target Python</text>
<rect x="130" y="458" width="400" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="330" y="482" font-weight="600">DependencyAnalyzer</text><text x="330" y="500" font-size="11" fill="#475569">cross-package conflicts · --check-conflicts</text>
<rect x="130" y="558" width="400" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="330" y="582" font-weight="600">report</text><text x="330" y="600" font-size="11" fill="#475569">table · simple · json · json-v2 · markdown</text>
<rect x="650" y="458" width="234" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="767" y="482" font-weight="600">verify</text><text x="767" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569">pip install --dry-run</text>
<rect x="650" y="558" width="234" height="56" rx="8" fill="#F1F5F9" stroke="#16A34A" stroke-width="1.5"/><text x="767" y="582" font-weight="600">atomic write</text><text x="767" y="600" font-size="11" fill="#475569">two-phase commit · rollback</text>
<g stroke="#2563EB" stroke-width="1.5" fill="none"><path d="M227,80 V116" marker-end="url(#ah)"/><path d="M432,80 V116" marker-end="url(#ah)"/><path d="M225,214 V256" marker-end="url(#ah)"/><path d="M225,314 V356" marker-end="url(#ah)"/><path d="M225,414 V456" marker-end="url(#ah)"/><path d="M225,514 V556" marker-end="url(#ah)"/><path d="M322,274 H398" marker-end="url(#ah)"/><path d="M398,298 H322" marker-end="url(#ah)"/><path d="M530,52 H555 V586"/><path d="M555,486 H648" marker-end="url(#ah)"/><path d="M555,586 H648" marker-end="url(#ah)"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569"><text x="235" y="102" text-anchor="start">path</text><text x="440" y="102" text-anchor="start">path</text><g text-anchor="end"><text x="217" y="240">List[Requirement]</text><text x="217" y="340">PyPI metadata</text><text x="217" y="440">List[Package]</text><text x="217" y="540">ResolutionResult</text></g><text x="360" y="253">GET /pypi/</text><text x="360" y="266">&lt;name&gt;/json</text><text x="360" y="328">JSON</text><text x="601" y="478">--verify</text><text x="601" y="578">apply_updates</text></g>
<g font-size="11" fill="#475569" text-anchor="start"><rect x="650" y="62" width="14" height="10" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><text x="672" y="71">one store, shared by checker and analyzer</text><path d="M650,92 H664" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah)"/><text x="672" y="96">arrow label = data carried</text></g>
</g>
</svg>
